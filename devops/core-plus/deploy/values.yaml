global:
  domain: ""
  # Host the HTTPRoute attaches to when httpRoute.hostnames is empty.
  hostname: ""
  useHttps: true
  limitsEnabled: true
  dataPartitionId: ""

data:
  # configmaps
  logLevel: "ERROR"
  secretAdminNamespace: "secret-admin"
  # deployments
  partitionSuffix: "_SYSTEM"
  datafierSa: "datafier"
  bucketPrefix: "refi"
  minioExternalEndpoint: "" # use only if external minio is configured
  minioIgnoreCertCheck: "false"
  minioUIEndpoint: "http://minio:9001"
  requestsCpu: "5m"
  requestsMemory: "350Mi"
  limitsCpu: "500m"
  limitsMemory: "1G"
  serviceAccountName: "partition"
  imagePullPolicy: "IfNotPresent"
  image: ""
  bootstrapImage: ""
  elasticHttps: ""
  # featureFlags
  indexerAugmenterEnabled: "true"
  asIngestedCoordinatesEnabled: "true"
  keywordLowerEnabled: "true"
  bagOfWordsEnabled: "true"
  collaborationsEnabled: "true"
  autocompleteEnabled: "false"
  policyServiceEnabled: "false"
  edsEnabled: "false"

conf:
  appName: "partition"
  configmap: "partition-config"
  secret: "partition-postgres-secret"
  replicas: 1

auth:
  realm: "osdu"
  localUrl: "keycloak"

httpRoute:
  enabled: false
  # Route name. Defaults to "<release>-route" so it never collides with a route of the same name
  # defined outside this chart.
  name: ""
  parentRefs:
    - name: cimpl-gateway
      namespace: istio-system
  # Defaults to global.hostname when empty. The render fails when both are empty.
  hostnames: []
  # One rule per entry. Optional per entry: pathType (default PathPrefix), serviceName
  # (default conf.appName), port (default 80) and filters (for example URLRewrite).
  routes:
    - path: /api/partition/

istio:
  proxyCPU: "5m"
  proxyCPULimit: "500m"
  proxyMemory: "64Mi"
  proxyMemoryLimit: "512Mi"
  bootstrapProxyCPU: "5m"
  bootstrapProxyCPULimit: "100m"
  sidecarInject: "true"
